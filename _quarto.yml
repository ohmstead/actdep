project:
  title: "actdep"
  # Run every document from the repository root so the project-relative
  # paths in 03-scripts/ resolve regardless of where the .qmd lives.
  execute-dir: project

author: "jack olmstead"
format: 
  html:
    toc: true
    toc_float: true
    code-fold: true
    code-tools: true
    code-line-numbers: true
    embed-resources: true
editor_options: 
  chunk_output_type: inline
execute:
  message: false
